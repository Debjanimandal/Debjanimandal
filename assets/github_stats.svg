<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <style>
    .lbl{font-family:'Segoe UI',sans-serif;font-size:12px;fill:#888}
    .val{font-family:'Segoe UI',sans-serif;font-size:13px;fill:#fff;font-weight:600}
    .ttl{font-family:'Segoe UI',sans-serif;font-size:14px;fill:#fff;font-weight:700}
    .rnk{font-family:'Segoe UI',sans-serif;font-size:26px;fill:#fff;font-weight:800}
    .sub{font-family:'Segoe UI',sans-serif;font-size:10px;fill:#888}
  </style>
  <rect width="495" height="195" rx="10" fill="#0D1117"/>
  <rect x="1" y="1" width="493" height="3" rx="2" fill="#a855f7" opacity="0.9"/>
  <rect x="1" y="1" width="493" height="193" rx="9" fill="none" stroke="#a855f7" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="22" cy="28" r="4" fill="#a855f7"/>
  <circle cx="22" cy="28" r="4" fill="#a855f7" opacity="0.4">
    <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text class="ttl" x="35" y="33">Debjani's GitHub Stats</text>
  <line x1="20" y1="45" x2="380" y2="45" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
  <rect x="20" y="61" width="5" height="5" rx="1" fill="#a855f7"/>
  <text class="lbl" x="33" y="68">Total Stars Earned</text>
  <text class="val" x="230" y="68">6</text>
  <rect x="20" y="86" width="5" height="5" rx="1" fill="#a855f7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text class="lbl" x="33" y="93">Total Commits (2024)</text>
  <text class="val" x="230" y="93">200+</text>
  <rect x="20" y="111" width="5" height="5" rx="1" fill="#a855f7"/>
  <text class="lbl" x="33" y="118">Total Pull Requests</text>
  <text class="val" x="230" y="118">12</text>
  <rect x="20" y="136" width="5" height="5" rx="1" fill="#a855f7"/>
  <text class="lbl" x="33" y="143">Total Issues</text>
  <text class="val" x="230" y="143">7</text>
  <rect x="20" y="161" width="5" height="5" rx="1" fill="#a855f7"/>
  <text class="lbl" x="33" y="168">Contributed to (last year)</text>
  <text class="val" x="230" y="168">4</text>
  <circle cx="432" cy="100" r="50" fill="#080810"/>
  <circle cx="432" cy="100" r="44" fill="none" stroke="#1a1030" stroke-width="7"/>
  <circle cx="432" cy="100" r="44" fill="none" stroke="url(#rg)" stroke-width="7"
          stroke-dasharray="276" stroke-dashoffset="276" stroke-linecap="round"
          transform="rotate(-90 432 100)">
    <animate attributeName="stroke-dashoffset" from="276" to="69" dur="2.5s" fill="freeze"/>
    <animate attributeName="stroke" values="#a855f7;#7c3aed;#c084fc;#a855f7" dur="5s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
  <defs>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <text class="sub" x="432" y="93" text-anchor="middle">Rank</text>
  <text class="rnk" x="432" y="117" text-anchor="middle">A+</text>
  <circle cx="8" cy="8" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="487" cy="8" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="8" cy="187" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="487" cy="187" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" begin="1.5s"/></circle>
</svg>
