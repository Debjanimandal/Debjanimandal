<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <style>
    .lng{font-family:'Segoe UI',sans-serif;font-size:11.5px;fill:#ccc}
    .pct{font-family:'Segoe UI',sans-serif;font-size:11px;fill:#a855f7;font-weight:700}
    .ttl{font-family:'Segoe UI',sans-serif;font-size:14px;fill:#fff;font-weight:700}
  </style>
  <rect width="495" height="195" rx="10" fill="#0D1117"/>
  <rect x="1" y="1" width="493" height="3" rx="2" fill="#a855f7" opacity="0.9"/>
  <rect x="1" y="1" width="493" height="193" rx="9" fill="none" stroke="#a855f7" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text class="ttl" x="25" y="32">Most Used Languages</text>
  <line x1="20" y1="42" x2="475" y2="42" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>

  <!-- Python -->
  <circle cx="26" cy="63" r="4" fill="#3776AB"/>
  <text class="lng" x="38" y="67">Python</text>
  <rect x="120" y="57" width="310" height="11" rx="5.5" fill="#161625"/>
  <rect x="120" y="57" width="1" height="11" rx="5.5" fill="url(#g1)">
    <animate attributeName="width" from="1" to="140" dur="1.8s" fill="freeze" begin="0.1s"/>
  </rect>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#3776AB"/><stop offset="100%" style="stop-color:#5ba3d9"/></linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#3178C6"/><stop offset="100%" style="stop-color:#60a0e8"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#7c3aed"/><stop offset="100%" style="stop-color:#a855f7"/></linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#9333ea"/><stop offset="100%" style="stop-color:#c084fc"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#6d28d9"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#4c1d95"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
  </defs>
  <text class="pct" x="468" y="67">45%</text>

  <!-- TypeScript -->
  <circle cx="26" cy="96" r="4" fill="#3178C6"/>
  <text class="lng" x="38" y="100">TypeScript</text>
  <rect x="120" y="90" width="310" height="11" rx="5.5" fill="#161625"/>
  <rect x="120" y="90" width="1" height="11" rx="5.5" fill="url(#g2)">
    <animate attributeName="width" from="1" to="78" dur="1.8s" fill="freeze" begin="0.3s"/>
  </rect>
  <text class="pct" x="468" y="100">25%</text>

  <!-- C++ -->
  <circle cx="26" cy="129" r="4" fill="#7c3aed"/>
  <text class="lng" x="38" y="133">C++</text>
  <rect x="120" y="123" width="310" height="11" rx="5.5" fill="#161625"/>
  <rect x="120" y="123" width="1" height="11" rx="5.5" fill="url(#g3)">
    <animate attributeName="width" from="1" to="47" dur="1.8s" fill="freeze" begin="0.5s"/>
  </rect>
  <text class="pct" x="468" y="133">15%</text>

  <!-- JavaScript -->
  <circle cx="26" cy="162" r="4" fill="#9333ea"/>
  <text class="lng" x="38" y="166">JavaScript</text>
  <rect x="120" y="156" width="310" height="11" rx="5.5" fill="#161625"/>
  <rect x="120" y="156" width="1" height="11" rx="5.5" fill="url(#g4)">
    <animate attributeName="width" from="1" to="25" dur="1.8s" fill="freeze" begin="0.7s"/>
  </rect>
  <text class="pct" x="468" y="166">8%</text>

  <!-- Streak bar at bottom -->
  <rect x="120" y="179" width="310" height="4" rx="2" fill="#161625"/>
  <rect x="120" y="179" width="1" height="4" rx="2" fill="url(#g5)">
    <animate attributeName="width" from="1" to="16" dur="1.8s" fill="freeze" begin="0.9s"/>
  </rect>
  <text class="lng" x="38" y="185" font-size="10">C + HTML</text>
  <text class="pct" x="468" y="185" font-size="10">7%</text>

  <!-- Corner dots -->
  <circle cx="8" cy="8" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="487" cy="8" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" begin="0.5s"/></circle>
  <circle cx="8" cy="187" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" begin="1s"/></circle>
  <circle cx="487" cy="187" r="2" fill="#a855f7"><animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" begin="1.5s"/></circle>
</svg>
