<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="800" height="60">

  <!-- Dark background -->
  <rect width="800" height="60" fill="#0D1117"/>

  <!-- Left equalizer bars (SMIL bounce) -->
  <rect x="20" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;30;2" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y" values="50;22;50" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="30" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;38;2" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="y" values="50;14;50" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
  </rect>
  <rect x="40" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;22;2" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="y" values="50;30;50" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="50" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;44;2" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
    <animate attributeName="y" values="50;8;50" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
  </rect>
  <rect x="60" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;28;2" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="y" values="50;24;50" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <rect x="70" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;18;2" dur="1.2s" repeatCount="indefinite" begin="0.75s"/>
    <animate attributeName="y" values="50;34;50" dur="1.2s" repeatCount="indefinite" begin="0.75s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.75s"/>
  </rect>

  <!-- Center title -->
  <text x="400" y="28"
        font-family="'Courier New', monospace"
        font-size="17"
        fill="#ffffff"
        letter-spacing="5"
        font-weight="bold"
        text-anchor="middle">GITHUB STATISTICS</text>

  <!-- Subtitle with blinking pulse -->
  <text x="400" y="48"
        font-family="'Courier New', monospace"
        font-size="10"
        fill="#a855f7"
        letter-spacing="3"
        text-anchor="middle">
    [ DEBJANI MANDAL ]
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Right equalizer bars (mirrored) -->
  <rect x="730" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;18;2" dur="1.2s" repeatCount="indefinite" begin="0.75s"/>
    <animate attributeName="y" values="50;34;50" dur="1.2s" repeatCount="indefinite" begin="0.75s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.75s"/>
  </rect>
  <rect x="720" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;28;2" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="y" values="50;24;50" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <rect x="710" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;44;2" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
    <animate attributeName="y" values="50;8;50" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.45s"/>
  </rect>
  <rect x="700" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;22;2" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="y" values="50;30;50" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="690" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;38;2" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="y" values="50;14;50" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
  </rect>
  <rect x="680" y="50" width="5" height="2" rx="1" fill="#a855f7">
    <animate attributeName="height" values="2;30;2" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="y" values="50;22;50" dur="1.2s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite" begin="0s"/>
  </rect>

  <!-- Scanning light sweep -->
  <rect y="0" width="3" height="60" fill="#a855f7" opacity="0.25">
    <animateTransform attributeName="transform" type="translate" from="-10,0" to="810,0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top and bottom border lines -->
  <line x1="0" y1="0.5" x2="800" y2="0.5" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="59.5" x2="800" y2="59.5" stroke="#a855f7" stroke-width="1" opacity="0.6"/>

</svg>
